[package]
name = "keepalive"
version = "0.1.0"
edition = "2021"
description = "Babysits one process: auto-restarts it on crash with exponential backoff and captures its stdout/stderr to a log file — supervisord for people who don't want Python or a config file"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/keepalive"
readme = "README.md"
keywords = ["supervisor", "process", "restart", "cli", "sysadmin"]
categories = ["command-line-utilities"]

[lib]
name = "keepalive"
path = "src/lib.rs"

[[bin]]
name = "keepalive"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
nix = { version = "0.29", features = ["signal", "process"] }
signal-hook = "0.3"
chrono = "0.4"
